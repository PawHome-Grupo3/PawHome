# ── Perfil para Render (hosting gratuito) ──────────────────────────────────────

# Puerto dinámico que inyecta Render en la variable de entorno PORT
server.port=${PORT:8080}

# Base de datos: Neon PostgreSQL (variables de entorno configuradas en Render)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP: ajustes para el tier gratuito de Neon (max 5 conexiones)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA: recrea el esquema en cada deploy, los DataLoaders rellenan los datos
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Desactivar Docker Compose (no disponible en Render)
spring.docker.compose.enabled=false

# Stripe: claves desde variables de entorno de Render
stripe.secretKey=${STRIPE_SECRET_KEY}
stripe.publicKey=${STRIPE_PUBLIC_KEY}

# Logging reducido en producción
logging.level.*=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.sql=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=WARN
